version: "2"

linters:
  default: standard
  enable:
    - dupl
    - cyclop
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - thelper
    - unconvert
    - unparam
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
    gosec:
      excludes:
        - G115
        - G404
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - revive
          - dupl
          - gosec
          - unparam
          - gocognit
          - cyclop
          - prealloc
          - errcheck
          - gocritic

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/danielriddell21/autobahn
