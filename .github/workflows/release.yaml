name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: danielriddell21/github-actions/.github/workflows/release.yaml@v2
    permissions:
      contents: write
    with:
      # letsgo writes formulas, not casks. This variant-free repository ships a
      # windowed build, so its release archives are what the cask installs.
      cask-name: autobahn
      cask-desc: A 3D driving game with a camera-only autopilot
      cask-caveats: >-
        autobahn opens a raylib window and is macOS-only; on Linux/Windows,
        build from source with -tags x11.
    secrets:
      tap-app-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
