name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          check-latest: true

      # raylib builds against the system windowing libraries. The x11 tag keeps
      # it off Wayland, so only the X11 development headers are needed.
      - name: Install raylib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev

      - name: Build
        run: go build -tags x11 ./...

      - name: Vet
        run: go vet -tags x11 ./...

      - name: Test
        run: go test -tags x11 -race ./...

      # The autopilot must not be able to reach simulation state. This is the
      # guarantee the whole camera-only design rests on, so it is checked rather
      # than trusted.
      - name: Perception boundary
        run: |
          deps=$(go list -tags x11 -deps ./internal/autopilot | grep autobahn)
          echo "$deps"
          if echo "$deps" | grep -qE '/internal/(sim|city|game|annotate)$'; then
            echo "FAIL: autopilot reaches simulation state" >&2
            exit 1
          fi
          echo "OK: autopilot sees only vision and mathx"

      # Drives the autopilot across a spread of cities with no display at all,
      # and fails if it starts breaking noticeably more rules than it does now.
      - name: Evaluate the autopilot
        run: go run ./tools/eval -seeds 16 -seconds 60 -max-points 40
