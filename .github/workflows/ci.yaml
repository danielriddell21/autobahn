name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    permissions:
      contents: read
    with:
      # A release candidate; promote.yaml publishes the stable version.
      pre: true
      raylib: true
      build-tags: x11
      vet: true
      # Twice, rather than once with both flags. Under the race detector
      # coverage counts atomically, and the two together took the traffic
      # tests from a minute to more than the ten the package is allowed.
      test-command: go test -tags x11 -race ./... && go test -tags x11 -coverprofile=coverage.txt ./...
      build-command: go build -tags x11 ./...
      # gremlins runs `go test` itself and cannot be given a build tag, so
      # mutation testing cannot compile the raylib packages.
      mutate: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      tag-token: ${{ secrets.AUTOBAHN_TOKEN }}

  # The autopilot must not be able to reach simulation state. This is the
  # guarantee the whole camera-only design rests on, so it is checked rather
  # than trusted.
  boundary:
    name: Perception boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2

      - name: Check the autopilot sees only vision and mathx
        run: |
          deps=$(go list -tags x11 -deps ./internal/autopilot | grep autobahn)
          echo "$deps"
          if echo "$deps" | grep -qE '/internal/(sim|city|game|annotate)$'; then
            echo "FAIL: autopilot reaches simulation state" >&2
            exit 1
          fi
          echo "OK: autopilot sees only vision and mathx"

  # Drives the autopilot across a spread of cities with no display at all,
  # and fails if it starts breaking noticeably more rules than it does now.
  evaluate:
    name: Evaluate the autopilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2

      # With two ambulances out on calls, which the autopilot has to give way to.
      - name: Score the autopilot across 24 cities
        run: go run ./tools/eval -map all -seeds 24 -seconds 60 -max-points 12 -ambulances 2

      # The same again with the roads dug up all over the place, which also
      # fails if the car drove past fewer than 24 of them: a gate that met no
      # roadworks would be testing nothing.
      - name: Score the autopilot among the roadworks
        run: go run ./tools/eval -map all -seeds 48 -seconds 60 -max-points 12 -works dense

      # And again in fog and in a storm, where the camera loses its far markers
      # and the autopilot has to slow to what it can see.
      - name: Score the autopilot in fog and storm
        run: go run ./tools/eval -map all -seeds 24 -seconds 60 -max-points 12 -weather fog,storm

      # And the custom map editor's hardest corner: every range at its limit at
      # once. The ranges are only as wide as this passes the same mark, so if it
      # fails, narrow the ranges rather than raising the mark.
      - name: Score the autopilot on the custom edge profile
        run: go run ./tools/eval -map custom:edge -seeds 24 -seconds 60 -max-points 12
