name: Promote

# Unticking "Set as a pre-release" on a release candidate in the GitHub UI
# fires `released`. letsgo promote rebuilds the candidate, refuses if it does
# not match, tags the stable version and publishes it, then the cask
# is rendered from the stable manifest.

on:
  release:
    types: [released]

  # A failed promotion can be replayed by hand. Promoting is idempotent: it
  # refuses once the stable tag already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate to promote, such as v1.4.0-rc.1
        required: true

permissions:
  contents: write

jobs:
  promote:
    name: letsgo
    # `released` also fires for a stable release; only a candidate, a tag
    # with a "-", is something to promote.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      # Full history: the stable release's notes cover every candidate since
      # the last stable tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      # The compiler is a build input, so it is pinned by go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: danielriddell21/letsgo-action@v1
        with:
          command: promote
          args: --yes --work dist ${{ inputs.tag || github.event.release.tag_name }}

      # This repository ships a cask and no formula, which letsgo's own cask
      # plugin cannot do (it writes beside a formula), so the cask is rendered
      # from the stable manifest promote just published and committed here.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Publish the cask
        env:
          MANIFEST: dist/build/letsgo.json
          DESC: A 3D driving game with a camera-only autopilot
          CAVEATS: >-
            autobahn opens a raylib window and is macOS-only; on Linux/Windows, build from source with -tags x11.
        run: |
          set -euo pipefail
          TAG=$(jq -r .tag "${MANIFEST}")
          version=v0.6.2
          curl --proto '=https' --tlsv1.2 -fsSL             "https://github.com/danielriddell21/letsgo-plugins/releases/download/${version}/letsgo-cask_${version#v}_linux_amd64.tar.gz"             | sudo tar -xz -C /usr/local/bin letsgo-cask
          letsgo-cask "${MANIFEST}"             --repo "${GITHUB_REPOSITORY}"             --token autobahn             --desc "${DESC}"             --license MIT             --caveats "${CAVEATS}"             -o tap/Casks/autobahn.rb
          cd tap
          git add Casks/autobahn.rb
          if git diff --cached --quiet; then
            echo "cask unchanged"
            exit 0
          fi
          git config user.name "letsgo-champ[bot]"
          git config user.email "293666020+letsgo-champ[bot]@users.noreply.github.com"
          git commit -m "autobahn ${TAG}"
          git push
